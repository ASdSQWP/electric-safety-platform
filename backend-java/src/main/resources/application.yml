spring:
  application:
    name: electric-safety-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/esafety
    username: esafety
    password: esafety123
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  global-config:
    db-config:
      id-type: auto

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: esafety

ai:
  service-url: http://localhost:8000

jwt:
  secret: esafety-jwt-secret-key-change-in-production
  expiration: 86400000

server:
  port: 8080
